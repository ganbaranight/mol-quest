
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOL QUEST</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(ellipse at 50% 35%,
    #344b83 0%, #172345 45%, #090f24 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.game {
  width: 100%;
  max-width: 650px;
  text-align: center;
  padding: 28px 16px;
  border: 2px solid #7185b8;
  border-radius: 22px;
  background: rgba(10,19,44,.9);
  box-shadow: 0 0 35px #536cb855;
}

.symbol { font-size: 50px; }

h1 {
  font-size: clamp(38px, 9vw, 65px);
  color: #ffe59a;
  text-shadow: 0 0 15px #e7b94d;
  margin: 10px 0;
}

.subtitle {
  color: #b8c9f5;
  letter-spacing: 3px;
  font-size: 12px;
}

.story {
  margin: 25px auto;
  line-height: 1.9;
  color: #e2e8ff;
  font-size: 14px;
}

.screen { display: none; }
.screen.active { display: block; }

.start-button {
  display: block;
  width: 85%;
  max-width: 300px;
  margin: 15px auto;
  padding: 16px;
  border: 2px solid #ffe59a;
  border-radius: 12px;
  background: linear-gradient(135deg,#e8b64e,#a66c25);
  color: #24162a;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.sub-button, .choice {
  background: #26385e;
  border: 1px solid #8195c5;
  color: white;
  border-radius: 10px;
  padding: 13px;
  margin: 8px auto;
  cursor: pointer;
}

.choice {
  display: block;
  width: 90%;
  max-width: 340px;
  font-size: 16px;
}

.hp-track {
  width: 100%;
  height: 16px;
  background: #444;
  border-radius: 10px;
  overflow: hidden;
}

#hpBar {
  width: 100%;
  height: 100%;
  background: #4ade80;
  transition: width .4s;
}

#question {
  font-size: 18px;
  line-height: 1.7;
  margin: 18px 0;
}

.calculator {
  max-width: 390px;
  margin: 18px auto;
  padding: 14px;
  border: 1px solid #8195c5;
  border-radius: 16px;
  background: #142344;
}

.display {
  min-height: 90px;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
  background: #07152c;
  text-align: right;
  overflow-wrap: anywhere;
}

.display-label {
  color: #91a8d9;
  font-size: 12px;
}

#expression {
  font-size: 23px;
  margin-top: 10px;
  color: #fff0b2;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 8px;
}

.key {
  min-height: 52px;
  padding: 5px 2px;
  border: 1px solid #526b9c;
  border-radius: 9px;
  background: #293f6b;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.key:active {
  background: #5774ad;
}

.key.special {
  background: #244e88;
  color: #bceaff;
  font-size: 15px;
}

.key.operator {
  background: #43517e;
  color: #ffe59a;
}

.key.clear {
  background: #813d52;
}

.key.answer {
  grid-column: span 4;
  background: linear-gradient(135deg,#e8b64e,#a66c25);
  color: #24162a;
  font-size: 19px;
  border-color: #ffe59a;
}

.key:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#result {
  min-height: 48px;
  line-height: 1.6;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #aebee7;
  line-height: 1.7;
}

.info {
  color: #92a5d5;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<main class="game">

  <!-- タイトル -->
  <section id="title" class="screen active">
    <div class="symbol">⚗️ ✨</div>
    <h1>MOL QUEST</h1>
    <div class="subtitle">
      THE ADVENTURE OF CHEMISTRY
    </div>

    <p class="story">
      ここは、物質の不思議が眠る世界。<br>
      モルの力を手に入れ、<br>
      化学の冒険に出発しよう！
    </p>

    <button class="start-button"
      onclick="showScreen('menu')">
      ▶ 冒険をはじめる
    </button>

    <div class="info">CHEMISTRY RPG PROJECT</div>
  </section>

  <!-- メニュー -->
  <section id="menu" class="screen">
    <div class="symbol">🧙‍♂️</div>
    <h1 style="font-size:38px;">冒険の準備</h1>
    <p class="story">どの冒険に挑戦する？</p>

    <button class="choice" onclick="startBattle()">
      ⚔️ モルの修行
    </button>

    <button class="choice"
      onclick="alert('図鑑は今後実装予定！')">
      📖 モンスター図鑑
    </button>

    <button class="choice"
      onclick="alert('記録機能は今後実装予定！')">
      🏆 冒険の記録
    </button>

    <button class="sub-button"
      onclick="showScreen('title')">
      タイトルに戻る
    </button>
  </section>

  <!-- バトル -->
  <section id="battle" class="screen">
    <div class="symbol">👾</div>
    <p id="monsterHP">スライム HP：100 / 100</p>
    <div class="hp-track">
      <div id="hpBar"></div>
    </div>

    <h1 style="font-size:35px;">BATTLE!</h1>

    <h2 id="questionNumber">第1問 / 5問</h2>
    <p id="question"></p>

    <div class="calculator">
      <div class="display">
        <div class="display-label">計算式を入力</div>
        <div id="expression">0</div>
      </div>

      <div class="keys">
        <button class="key" onclick="insert('7')">7</button>
        <button class="key" onclick="insert('8')">8</button>
        <button class="key" onclick="insert('9')">9</button>
        <button class="key operator" onclick="insert('/')">÷</button>

        <button class="key" onclick="insert('4')">4</button>
        <button class="key" onclick="insert('5')">5</button>
        <button class="key" onclick="insert('6')">6</button>
        <button class="key operator" onclick="insert('*')">×</button>

        <button class="key" onclick="insert('1')">1</button>
        <button class="key" onclick="insert('2')">2</button>
        <button class="key" onclick="insert('3')">3</button>
        <button class="key operator" onclick="insert('-')">−</button>

        <button class="key" onclick="insert('0')">0</button>
        <button class="key" onclick="insert('.')">.</button>
        <button class="key operator" onclick="insert('+')">+</button>
        <button class="key operator" onclick="insert('^')">xʸ</button>

        <button class="key special" onclick="insert('E')">×10ˣ</button>
        <button class="key special" onclick="insert('NA')">Nₐ</button>
        <button class="key special" onclick="insert('VM')">22.4</button>
        <button class="key special" onclick="toggleSign()">±</button>

        <button class="key operator" onclick="insert('(')">(</button>
        <button class="key operator" onclick="insert(')')">)</button>
        <button class="key clear" onclick="clearInput()">C</button>
        <button class="key" onclick="backspace()">⌫</button>

        <button class="key answer" id="answerButton"
          onclick="checkAnswer()">
          ⚔️ 解答して攻撃！
        </button>
      </div>
    </div>

    <p class="note">
      Nₐ = 6.0 × 10²³ mol⁻¹<br>
      22.4 = 標準状態の気体のモル体積（L/mol）
    </p>

    <p id="result" aria-live="polite"></p>

    <button class="sub-button"
      onclick="showScreen('menu')">
      メニューに戻る
    </button>
  </section>

  <!-- 勝利 -->
  <section id="victory" class="screen">
    <div class="symbol">🏆✨</div>
    <h1>VICTORY!</h1>
    <p class="story">
      スライムを倒した！<br>
      5問正解！モルの修行クリア！
    </p>
    <button class="start-button" onclick="startBattle()">
      ▶ もう一度挑戦
    </button>
    <button class="sub-button"
      onclick="showScreen('menu')">
      メニューに戻る
    </button>
  </section>

</main>

<script>
const questions = [
  {
    text: "水 H₂O 36 g は何 mol？",
    answer: 2
  },
  {
    text: "標準状態の酸素 O₂ 44.8 L は何 mol？",
    answer: 2
  },
  {
    text: "1.2 × 10²⁴ 個の分子は何 mol？",
    answer: 2
  },
  {
    text: "二酸化炭素 CO₂ 88 g は何 mol？",
    answer: 2
  },
  {
    text: "0.50 mol の気体は標準状態で何 L？",
    answer: 11.2
  }
];

let monsterHP = 100;
let questionIndex = 0;
let expression = "";
let locked = false;
let nextQuestionTimer = null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function startBattle() {
  if (nextQuestionTimer !== null) {
    clearTimeout(nextQuestionTimer);
    nextQuestionTimer = null;
  }

  monsterHP = 100;
  questionIndex = 0;
  locked = false;

  updateHP();
  loadQuestion();
  showScreen("battle");
}

function updateHP() {
  document.getElementById("monsterHP").textContent =
    "スライム HP：" + monsterHP + " / 100";

  document.getElementById("hpBar").style.width =
    monsterHP + "%";
}

function loadQuestion() {
  expression = "";
  locked = false;

  document.getElementById("questionNumber").textContent =
    "第" + (questionIndex + 1) + "問 / 5問";

  document.getElementById("question").textContent =
    questions[questionIndex].text;

  document.getElementById("result").textContent = "";
  document.getElementById("answerButton").disabled = false;
  updateDisplay();
}

function insert(value) {
  if (locked) return;

  if (value === "NA") {
    expression += "(6.0E23)";
  } else if (value === "VM") {
    expression += "22.4";
  } else {
    expression += value;
  }

  updateDisplay();
}

function clearInput() {
  if (locked) return;
  expression = "";
  updateDisplay();
}

function backspace() {
  if (locked) return;

  if (expression.endsWith("(6.0E23)")) {
    expression = expression.slice(0, -8);
  } else {
    expression = expression.slice(0, -1);
  }

  updateDisplay();
}

function toggleSign() {
  if (locked) return;

  // 末尾の数値または指数の符号を切り替える
  const match = expression.match(
    /(-?\d+(?:\.\d*)?(?:E[+-]?\d*)?)$/
  );

  if (!match) return;

  const value = match[0];
  const start = expression.length - value.length;

  if (/E[+-]?\d*$/.test(value)) {
    const eIndex = value.lastIndexOf("E");
    const before = value.slice(0, eIndex + 1);
    const exponent = value.slice(eIndex + 1);

    const changed = exponent.startsWith("-")
      ? exponent.slice(1)
      : "-" + exponent.replace(/^\+/, "");

    expression = expression.slice(0, start)
      + before + changed;
  } else {
    const changed = value.startsWith("-")
      ? value.slice(1)
      : "-" + value;

    expression = expression.slice(0, start) + changed;
  }

  updateDisplay();
}

function updateDisplay() {
  let shown = expression
    .replace(/\*/g, "×")
    .replace(/\//g, "÷")
    .replace(/\^/g, "^")
    .replace(/E([+-]?\d+)/g, "×10^($1)");

  document.getElementById("expression").textContent =
    shown || "0";
}

// 数式を安全に計算する
// evalやFunctionは使用しない
function calculate(input) {
  const tokens = [];
  let pos = 0;

  while (pos < input.length) {
    const rest = input.slice(pos);

    const numberMatch = rest.match(
      /^(?:\d+(?:\.\d*)?|\.\d+)(?:E[+-]?\d+)?/
    );

    if (numberMatch) {
      tokens.push({
        type: "number",
        value: Number(numberMatch[0])
      });
      pos += numberMatch[0].length;
      continue;
    }

    const char = input[pos];

    if ("+-*/^()".includes(char)) {
      tokens.push({ type: char });
      pos++;
      continue;
    }

    throw new Error("使えない文字があります");
  }

  let index = 0;

  function peek() {
    return tokens[index]?.type;
  }

  function consume(type) {
    if (peek() !== type) {
      throw new Error("式を確認してください");
    }
    index++;
  }

  function primary() {
    if (peek() === "number") {
      return tokens[index++].value;
    }

    if (peek() === "(") {
      consume("(");
      const value = addition();
      consume(")");
      return value;
    }

    throw new Error("数値が必要です");
  }

  function power() {
    const base = primary();

    if (peek() === "^") {
      consume("^");
      return Math.pow(base, unary());
    }

    return base;
  }

  function unary() {
    if (peek() === "+") {
      consume("+");
      return unary();
    }

    if (peek() === "-") {
      consume("-");
      return -unary();
    }

    return power();
  }

  function multiplication() {
    let value = unary();

    while (peek() === "*" || peek() === "/") {
      const op = peek();
      index++;

      const right = unary();

      if (op === "*") value *= right;
      else value /= right;
    }

    return value;
  }

  function addition() {
    let value = multiplication();

    while (peek() === "+" || peek() === "-") {
      const op = peek();
      index++;

      const right = multiplication();

      if (op === "+") value += right;
      else value -= right;
    }

    return value;
  }

  if (tokens.length === 0) {
    throw new Error("式が空です");
  }

  const result = addition();

  if (index !== tokens.length || !Number.isFinite(result)) {
    throw new Error("式を確認してください");
  }

  return result;
}

function checkAnswer() {
  if (locked) return;

  const resultElement = document.getElementById("result");

  let value;

  try {
    value = calculate(expression);
  } catch (error) {
    resultElement.textContent =
      "⚠️ 計算式を確認してね！";
    resultElement.style.color = "#fbbf24";
    return;
  }

  const correct = questions[questionIndex].answer;
  const tolerance = Math.max(
    1e-9,
    Math.abs(correct) * 1e-6
  );

  if (Math.abs(value - correct) <= tolerance) {
    locked = true;
    document.getElementById("answerButton").disabled = true;

    monsterHP = Math.max(0, monsterHP - 20);
    updateHP();

    resultElement.textContent =
      "🎉 正解！スライムに20ダメージ！";
    resultElement.style.color = "#4ade80";

    nextQuestionTimer = setTimeout(() => {
      nextQuestionTimer = null;
      questionIndex++;

      if (questionIndex >= questions.length) {
        showScreen("victory");
      } else {
        loadQuestion();
      }
    }, 1400);

  } else {
    resultElement.textContent =
      "❌ 不正解！もう一度考えよう！";
    resultElement.style.color = "#f87171";
  }
}
</script>
</body>
</html>
